<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophos Quarantine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      color: #222;
    }

    button {
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      cursor: pointer;
    }

    a {
      color: #0066cc;
    }
  </style>
</head>
<body>
  <p>This add-in opens the Sophos Self-Service Quarantine portal.</p>

  <button id="openSophos" type="button">
    Open Sophos Self-Service Quarantine
  </button>

  <p>
    <a id="fallbackLink" target="_blank" rel="noopener noreferrer">
      Open using a link instead
    </a>
  </p>

  <script>
    (() => {
      const targetUrl =
        "https://cloud.sophos.com/manage/self-service";

      const button = document.getElementById("openSophos");
      const fallbackLink = document.getElementById("fallbackLink");

      fallbackLink.href = targetUrl;

      button.addEventListener("click", () => {
        window.open(targetUrl, "_blank", "noopener,noreferrer");
      });
    })();
  </script>
</body>
</html>
